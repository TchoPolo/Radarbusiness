function normalizeAffaire(s){
  if(!s || !s.entreprise) return null;
  const m = String(s.lieu||"").match(/\((\d{2})\)/);
  return Object.assign({}, s, {
    kind:"affaire",
    id:"af-"+norm(s.entreprise).replace(/[^a-z0-9]+/g,"-").substring(0,40)+"-"+(s.date||""),
    objet:s.entreprise, societe:s.entreprise, acheteur:s.entreprise,
    dateParution:s.date||null, dateLimite:null,
    depts: m && DEPTS[m[1]] ? [m[1]] : [],
    score: Number(s.score)||0,
    url: s.source||"",
  });
}

function sameEntity(a,b){
  if(!a || !b || a.length<4 || b.length<4) return false;
  if(a===b) return true;
  const re = (k) => new RegExp("(^| )"+k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"( |$)");
  return (a.length>=5 && re(a).test(b)) || (b.length>=5 && re(b).test(a));
}

const norm = (s) => String(s||"").toLowerCase().normalize("NFD")
  .replace(/[\u0300-\u036f]/g,"").replace(/['\u2019`]/g,"'");
const fmtDate = (d) => { if(!d) return "—"; const x=new Date(d); return isNaN(x)?"—":x.toLocaleDateString("fr-FR"); };
const daysLeft = (d) => { if(!d) return null; const x=new Date(d); return isNaN(x)?null:Math.ceil((x-new Date())/86400000); };
const urgColor = (n) => n===null?T.mute:n<0?T.mute:n<=7?T.hot:n<=21?T.warm:T.ok;
const pick = (o,ks)=>{ for(let i=0;i<ks.length;i++){ const v=o[ks[i]]; if(v!==null&&v!==undefined&&v!==""&&v!=="null") return v; } return null; };
const asArr = (v)=> v===null||v===undefined?[]:Array.isArray(v)?v:[v];

/* Modèle IA utilisé partout : à changer ici seulement */
const MODEL = "claude-sonnet-5-5";

/* Dates locales AAAA-MM-JJ */
const isoDay = (d) => { const x=d||new Date(); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); };
const todayISO = () => isoDay(new Date());
const addDays = (n) => { const x=new Date(); x.setDate(x.getDate()+n); return isoDay(x); };

function downloadCsv(name, head, rows){
  const csv=[head].concat(rows).map((r)=>r.map((c)=>{
    const s=String(c==null?"":c); return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(";")).join("\n");
  const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const el=document.createElement("a");
  el.href=url; el.download=name; el.style.display="none";
  document.body.appendChild(el); el.click();
  setTimeout(()=>{ document.body.removeChild(el); URL.revokeObjectURL(url); },100);
}

/* Stockage local */
const LS = {
  get(k,fb){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):fb; }catch(_){ return fb; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(_){} },
  getRaw(k,fb){ try{ return localStorage.getItem(k) || fb; }catch(_){ return fb; } },
  setRaw(k,v){ try{ localStorage.setItem(k,v); }catch(_){} },
};

function extractJSON(text){
  if(!text) return null;
  const c = String(text).replace(/```json/gi,"").replace(/```/g,"");
  const s = c.indexOf("{"), e = c.lastIndexOf("}");
  if(s===-1||e<=s) return null;
  try{ return JSON.parse(c.substring(s,e+1)); }catch(_){ return null; }
}

/* Correspondance en mots entiers (pluriel en -s/-x toléré) :
   évite « tpe » dans « type », « vente » dans « prévention », « devise » dans « devis »… */
const RX_CACHE = {};
function termRx(t){
  if(!RX_CACHE[t]){
    const esc = t.replace(/[.*+?^${}()|[\]\\\/]/g,"\\$&").replace(/ /g,"[\\s\\-]+");
    RX_CACHE[t] = new RegExp("(^|[^a-z0-9])"+esc+"(s|x)?(?=[^a-z0-9]|$)");
  }
  return RX_CACHE[t];
}
const hasTerm = (hay,t) => termRx(t).test(hay);

function scoreItem(hay, catalog, keys, enabled){
  let raw=0; const matched=[], hits=[];
  keys.forEach(function(k){
    if(enabled && !enabled[k]) return;
    const c=catalog[k];
    const found=c.terms.filter(function(t){ return hasTerm(hay,t); });
    if(found.length){
      raw += c.weight + Math.min(found.length-1,4)*1.5;
      matched.push(k);
      found.slice(0,3).forEach(function(f){ if(hits.indexOf(f)===-1) hits.push(f); });
    }
  });
  if(!raw) return null;
  if(matched.length>=3) raw+=6; else if(matched.length===2) raw+=3;
  const score=Math.min(100,Math.round(raw*3.2));
  return { score, tier: score>=62?"Élevée":score>=36?"Moyenne":"Faible", categories:matched, hits };
}

async function fetchJSON(url, log, quiet){
  const routes=[
    { n:"Direct", u:url },
    { n:"corsproxy", u:"https://corsproxy.io/?url="+encodeURIComponent(url) },
    { n:"allorigins", u:"https://api.allorigins.win/raw?url="+encodeURIComponent(url) },
  ];
  for(let i=0;i<routes.length;i++){
    try{
      const r=await fetch(routes[i].u,{ headers:{ Accept:"application/json" } });
      if(!r.ok){
        log("  ✗ "+routes[i].n+" → HTTP "+r.status);
        if(r.status===400 && i===0) return { bad:true };   /* requête refusée : inutile d'essayer les proxys */
        continue;
      }
      const d=await r.json();
      log("  ✓ "+routes[i].n);
      return { data:d, via:routes[i].n };
    }catch(e){ log("  ✗ "+routes[i].n+" → "+((e&&e.message)||"bloqué")); }
  }
  return null;
}

/* Appel Anthropic depuis le navigateur */
async function callClaude(apiKey, body){
  if(!apiKey) throw new Error("clé API absente");
  const res = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "x-api-key":apiKey,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true",
    },
    body: JSON.stringify(body),
  });
  if(!res.ok){
    let msg = "HTTP "+res.status;
    try{ const j=await res.json(); if(j&&j.error&&j.error.message) msg=j.error.message; }catch(_){}
    throw new Error(msg);
  }
  return res.json();
}

/* ─── BOAMP ───────────────────────────────────────────────────── */
function normalizeAO(r0){
  const r = r0 && r0.fields ? r0.fields : r0;
  if(!r || typeof r!=="object") return null;
  const objet = pick(r,["objet","objet_marche","OBJET_MARCHE","intitule","titre"]);
  if(!objet) return null;
  const idweb = pick(r,["idweb","id_web","id"]);
  const depts = asArr(pick(r,["code_departement","code_dept","departement","dept"]))
    .map(function(d){ return String(d).padStart(2,"0").substring(0,2); })
    .filter(function(d){ return /^\d{2}$/.test(d); });
  const descripteur = asArr(pick(r,["descripteur_libelle","descripteur"])).join(" ");
  let extra="";
  try{ const dn=r.donnees; if(dn) extra = typeof dn==="string"?dn:JSON.stringify(dn); }catch(_){}
  return {
    kind:"ao",
    id:"ao-"+String(idweb||objet).substring(0,70),
    ref: idweb?String(idweb):null,
    objet:String(objet).substring(0,500),
    acheteur:String(pick(r,["nomacheteur","nom_acheteur","acheteur","organisme"])||"Acheteur non précisé").substring(0,180),
    dateParution: pick(r,["dateparution","date_parution"]),
    dateLimite: pick(r,["datelimitereponse","date_limite_reponse","datelimite","dlro"]),
    depts, descripteur,
    typeAvis:String(pick(r,["nature_libelle","type_avis","typeavis"])||""),
    resultat:/resultat|attribution/.test(norm(pick(r,["nature_libelle","nature","type_avis"])||"")),
    procedure:String(pick(r,["procedure_libelle","procedure"])||""),
    url: pick(r,["url_avis","urlavis"]) || (idweb?"https://www.boamp.fr/avis/detail/"+idweb:"https://www.boamp.fr"),
    hay: norm([objet,pick(r,["nomacheteur","acheteur"]),descripteur,pick(r,["type_avis"]),
      extra.replace(/\\u00[0-9a-f]{2}/gi," ").replace(/&[a-z#0-9]+;/gi," ").substring(0,9000)].join(" | ")),
  };
}

/* Codes département : BOAMP supprime le zéro initial (Aisne = "2") */
const deptVariants = (depts) => {
  const out=[]; depts.forEach((d)=>{ out.push(d); const nz=String(Number(d)); if(nz!==d) out.push(nz); }); return out;
};
const orEq = (field, vals) => "("+vals.map((v)=>field+' = "'+v+'"').join(" or ")+")";

/* Mots-clés envoyés au serveur (recherche plein texte) : rattrape les avis
   que le balayage par pages n'aurait pas atteints */
const AO_SERVER_TERMS = ["services bancaires","prestations bancaires","marché bancaire","tenue de compte","monétique",
  "terminaux de paiement","encaissement","paiement en ligne","solution de paiement","moyens de paiement","cash management",
  "trésorerie","titres restaurant","chèques vacances","chèques cadeaux","CESU","régie de recettes","mandataire financier",
  "affacturage","ligne de trésorerie","emprunt","facturation électronique"];

async function pagedQuery(base, where, maxRows, label, log, prog, orderBy){
  const rows=[]; let total=null, via="";
  for(let off=0; off<maxRows && off<10000; off+=100){
    prog(label+" · "+(off+100>maxRows?maxRows:off+100)+(total!==null?" / "+total:""));
    const qs=new URLSearchParams({ order_by:orderBy||"dateparution desc,idweb", limit:"100", offset:String(off) });
    if(where) qs.set("where",where);
    const got=await fetchJSON(base+"?"+qs.toString(), log);
    if(!got) return rows.length?{ rows, total, via }:null;
    if(got.bad) return { bad:true };
    const d=got.data; via=got.via;
    if(total===null && typeof d.total_count==="number"){ total=d.total_count; log("  "+total+" avis correspondent"); }
    const rs=d.results||d.records||[];
    if(!Array.isArray(rs)||!rs.length) break;
    rows.push.apply(rows,rs);
    if(rs.length<100 || (total!==null && off+100>=total)) break;
  }
  if(total!==null && total>rows.length) log("  ⚠ plafond atteint : "+rows.length+" lus sur "+total+" (augmentez le plafond)");
  return { rows, total, via };
}

async function scanBOAMP(depts, days, pages, log, prog){
  const since=new Date(); since.setDate(since.getDate()-days);
  const iso=isoDay(since);
  const deptW = orEq("code_departement", deptVariants(depts));
  const dateW = "dateparution >= date'"+iso+"'";
  const kwW = "("+AO_SERVER_TERMS.map((t)=>'search("'+t+'")').join(" or ")+")";
  const byId = {}; const vias=[]; let any=false;
  const keep = (rs) => rs.forEach((r)=>{ const f=r&&r.fields?r.fields:r; const k=(f&&(f.idweb||f.id))||JSON.stringify(f).slice(0,80); byId[k]=r; });

  for(const base of [ENDPOINTS.boamp, ENDPOINTS.boampAlt]){
    log("── BOAMP · "+(base===ENDPOINTS.boamp?"API open data DILA":"boamp.fr (secours)"));
    /* 1. Balayage complet du territoire sur la période */
    log("1/2 Balayage complet "+depts.join(",")+" depuis le "+iso);
    const a = await pagedQuery(base, deptW+" and "+dateW, pages*100, "BOAMP · balayage", log, prog);
    if(a && !a.bad){ keep(a.rows); any=true; vias.push(a.via); log("→ "+a.rows.length+" avis lus"); }
    else if(a && a.bad) log("→ filtre refusé par l'API");
    /* 2. Recherche plein texte sur les mots-clés bancaires */
    log("2/2 Recherche par mots-clés");
    const b = await pagedQuery(base, deptW+" and "+dateW+" and "+kwW, 1000, "BOAMP · mots-clés", log, prog);
    if(b && !b.bad){ keep(b.rows); any=true; vias.push(b.via); log("→ "+b.rows.length+" avis par mots-clés"); }
    else if(b && b.bad) log("→ recherche plein texte refusée, balayage seul");
    if(any) break;
  }
  const rows=Object.values(byId);
  if(!any){ log("BOAMP — aucune réponse exploitable"); return null; }
  log("→ "+rows.length+" avis uniques après fusion");
  return { rows, plan:"Balayage + mots-clés", via:Array.from(new Set(vias)).join("/") };
}

/* ─── BODACC ──────────────────────────────────────────────────── */
function normalizeSignal(r0){
  const r = r0 && r0.fields ? r0.fields : r0;
  if(!r || typeof r!=="object") return null;
  const societe = pick(r,["commercant","denomination","nom","raison_sociale"]);
  const famille = String(pick(r,["familleavis_lib","familleavis","typeavis_lib","typeavis"])||"");
  if(!societe && !famille) return null;
  let details="";
  ["modificationsgenerales","personnes","depot","jugement","vente","etablissement","descriptif"].forEach(function(k){
    const v=r[k]; if(!v) return;
    details += " " + (typeof v==="string"?v:JSON.stringify(v));
  });
  const dept=String(pick(r,["numerodepartement","code_departement","departement"])||"").padStart(2,"0").substring(0,2);
  const id=pick(r,["id","publicationavis","numeroannonce"])||(societe+famille);
  return {
    kind:"sig",
    id:"sig-"+String(id).substring(0,70),
    ref:String(pick(r,["numeroannonce","publicationavis"])||""),
    objet:(famille?famille+" — ":"")+(societe||"Entité non nommée"),
    societe:String(societe||"—").substring(0,180),
    acheteur:String(societe||"—").substring(0,180),
    famille,
    ville:String(pick(r,["ville","cp_ville"])||""),
    dateParution:pick(r,["dateparution","date_parution"]),
    dateLimite:null,
    depts:/^\d{2}$/.test(dept)?[dept]:[],
    details:details.replace(/[{}"\[\]]/g," ").replace(/\s+/g," ").trim().substring(0,900),
    url:"https://www.bodacc.fr/pages/annonces-commerciales/",
    hay:norm([societe,famille,details.substring(0,3000)].join(" | ")),
  };
}

async function scanBODACC(depts, days, pages, log, prog){
  const since=new Date(); since.setDate(since.getDate()-days);
  const iso=isoDay(since);
  const deptW = orEq("numerodepartement", deptVariants(depts));
  const dateW = "dateparution >= date'"+iso+"'";
  /* Les dépôts de comptes et radiations noient les vrais signaux : exclus côté serveur */
  const famW = 'familleavis != "dpc" and familleavis != "radiation"';
  log("── BODACC · hors dépôts de comptes et radiations");
  let r = await pagedQuery(ENDPOINTS.bodacc, deptW+" and "+dateW+" and "+famW, pages*100, "BODACC", log, prog, "dateparution desc,id");
  if(!r || r.bad || !r.rows.length){
    log("── BODACC · sans filtre de famille");
    r = await pagedQuery(ENDPOINTS.bodacc, deptW+" and "+dateW, pages*100, "BODACC", log, prog, "dateparution desc,id");
  }
  if(!r || r.bad || !r.rows.length){ log("BODACC — aucune réponse exploitable"); return null; }
  log("→ "+r.rows.length+" annonces lues");
  return { rows:r.rows, plan:"Territoire + période", via:r.via };
}

  log("── Presse · recherche IA");
  const zone=depts.map(function(d){ return DEPTS[d]; }).join(", ");
  try{
    const data = await callClaude(apiKey,{
      model:MODEL, max_tokens:5000,
      tools:[{ type:"web_search_20250305", name:"web_search" }],
      system:"Tu es analyste en intelligence commerciale. Tu identifies des signaux d'affaires récents dans la presse économique régionale et nationale. Tu réponds UNIQUEMENT en JSON valide, sans markdown ni backtick.",
      messages:[{ role:"user", content:

        "Signaux recherchés, par ordre de priorité :\n"+

        "2. Changement de directeur général, président, arrivée d'un nouveau dirigeant\n"+
        "3. Projet de refonte des systèmes d'encaissement, de caisse, de monétique ou de paiement\n"+
        "4. Déploiement ou remplacement d'un TMS, ERP finance, SAP S/4HANA, Kyriba, Sage XRT\n"+
        "5. Projet de facturation électronique, dématérialisation financière, centralisation de trésorerie\n"+
        "6. Levée de fonds, acquisition, ouverture de site, expansion internationale\n\n"+
        "Sources à privilégier : La Voix du Nord Éco, Gazette Nord-Pas-de-Calais, Picardie la Gazette, Les Échos, L'Usine Nouvelle, Journal des Entreprises, communiqués d'entreprises.\n\n"+
        "Retourne exactement ce JSON, 12 signaux maximum, les plus récents et exploitables :\n"+
        '{"results":[{"societe":"nom","fonction":"poste ou type de projet","signal":"description factuelle en une phrase",'+
        '"categorie":"direction|encaissement|si_finance|croissance","dept":"59","date":"AAAA-MM-JJ",'+
        '"source":"média","url":"lien","angle":"comment aborder commercialement ce signal, en une phrase"}]}\n'+
        'Si rien de probant : {"results":[]}' }],
    });
    const txt=(data.content||[]).filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("\n");
    const parsed=extractJSON(txt);
    const out=parsed&&Array.isArray(parsed.results)?parsed.results:[];
    log("  ✓ presse → "+out.length+" signaux");
    return out.map(function(s,i){
      return {
        kind:"presse",

        source:s.source||"", dateParution:s.date||null, dateLimite:null,
        depts:(s.dept&&/^\d{2}$/.test(String(s.dept)))?[String(s.dept)]:[],
        url:s.url||"",
      };
    });
  }catch(e){ log("  ✗ presse → "+((e&&e.message)||"erreur")); return []; }
}

              </div>

          {item.kind==="presse" && (

              {item.signal && <div style={{ background:T.coolLt, borderLeft:"3px solid "+T.cool,
                borderRadius:"0 5px 5px 0", padding:"9px 12px", marginBottom:7, fontSize:13, color:T.body }}>

            <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))", gap:10,
                           marginBottom:13, padding:"11px 13px", background:"#fff",
                           border:"1px solid "+T.line, borderRadius:7 }}>
              {[{l:"Date limite",v:fmtDate(item.dateLimite)},{l:"Type",v:item.typeAvis||"—"},
                {l:"Procédure",v:item.procedure||"—"},{l:"Référence",v:item.ref||"—"}].map((f,i)=>(

              {[{l:"Lecture du besoin",v:ai.besoin,c:T.brand},{l:"Angle d'attaque",v:ai.angle,c:T.ok},
                {l:"Interlocuteur à viser",v:ai.interlocuteur,c:T.cool},{l:"Point de vigilance",v:ai.vigilance,c:T.hot},
                {l:"Message LinkedIn",v:ai.message,c:T.ok}]
                .map((b,i)=> b.v ? (
                <div key={i} style={{ background:b.c+"0F", borderLeft:"3px solid "+b.c,

                  <div style={{ fontSize:13, color:T.body, marginTop:3 }}>{b.v}</div>

              ) : null)}
              {ai.message && (
                <Btn kind={copied==="ai"?"ok":"plain"} onClick={()=>copy(ai.message,"ai")}>

          {ai && ai.error && (

          {mode==="pipe" && item.kind!=="ao" && <SequencePanel item={item} onUpdate={onUpdate} copy={copy} copied={copied} />}

          {mode==="pipe" && (
            <div>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:9, marginBottom:9 }}>
                <Field label="Statut">
                  <select value={item.status} onChange={(e)=>onUpdate(item.id,{status:e.target.value})} style={inputStyle}>
                    {statusKeysFor(item.kind).concat(statusKeysFor(item.kind).indexOf(item.status)===-1?[item.status]:[])
                      .map((k)=><option key={k} value={k}>{STATUS[k]?STATUS[k].label:k}</option>)}
                  </select>

                    onChange={(e)=>onUpdate(item.id,{relance:e.target.value})} />

                  placeholder={item.kind==="ao"?"Contact identifié, stratégie, concurrence en place…":"Profil LinkedIn, date d'envoi, réponse, prochaine étape…"}
                  style={Object.assign({},inputStyle,{ height:74, resize:"vertical", padding:8, fontSize:14 })} />
              </Field>
              <div style={{ marginTop:9 }}>
                <Btn onClick={()=>onRemove(item.id)} kind="danger">Retirer du pipeline</Btn>

      )}
    </div>
  );

/* ─── BARRE DE COMMANDE ───────────────────────────────────────── */

  return (
    <div style={{ background:T.card, border:"1px solid "+T.line, borderRadius:9, padding:15, marginBottom:15 }}>

          <select value={days} onChange={(e)=>setDays(Number(e.target.value))} style={inputStyle}>

/* ─── FLUX ────────────────────────────────────────────────────── */
function TabFlux({ items, kinds, empty, cats, setCats, catalog, catKeys, minScore, setMinScore,
                   onlyOpen, setOnlyOpen, sortBy, setSortBy, open, setOpen, aiCache, aiBusy,
                   pipeline, onAnalyze, onAdd, error, hasKey, linksFor, briefFor }){
  const [showCfg,setShowCfg]=useState(false);
  const shown=useMemo(()=>{
    let l=items.filter((a)=>kinds.indexOf(a.kind)!==-1);
    if(catalog) l=l.filter((a)=>!a.eval||a.eval.score>=minScore);
    if(onlyOpen) l=l.filter((a)=>{ if(a.resultat) return false; const d=daysLeft(a.dateLimite); return d===null||d>=0; });
    const s=l.slice();
    if(sortBy==="score") s.sort((a,b)=>((b.eval&&b.eval.score)||0)-((a.eval&&a.eval.score)||0));
    else if(sortBy==="deadline") s.sort((a,b)=>{ const x=daysLeft(a.dateLimite),y=daysLeft(b.dateLimite);
      if(x===null) return 1; if(y===null) return -1; return x-y; });
    else s.sort((a,b)=>new Date(b.dateParution||0)-new Date(a.dateParution||0));
    return s;
  },[items,kinds,minScore,onlyOpen,sortBy,catalog]);

  return (
    <div>
      {catalog && (
        <div style={{ background:T.card, border:"1px solid "+T.line, borderRadius:9, padding:"12px 15px", marginBottom:13 }}>
          <div style={{ display:"flex", alignItems:"center", gap:13, flexWrap:"wrap" }}>
            <div style={{ display:"flex", alignItems:"center", gap:9, flex:1, minWidth:190 }}>
              <span style={{ fontSize:11, color:T.mute, fontWeight:600, whiteSpace:"nowrap" }}>Score min. {minScore}</span>
              <input type="range" min="0" max="90" step="5" value={minScore}
                onChange={(e)=>setMinScore(Number(e.target.value))} style={{ flex:1 }} />
            </div>
            <select value={sortBy} onChange={(e)=>setSortBy(e.target.value)}
              style={Object.assign({},inputStyle,{ width:"auto", minWidth:150, fontSize:13 })}>
              <option value="score">Tri : pertinence</option>
              <option value="deadline">Tri : échéance</option>
              <option value="date">Tri : parution</option>
            </select>
            {setOnlyOpen && (
              <label style={{ display:"flex", alignItems:"center", gap:6, fontSize:12, color:T.body }}>
                <input type="checkbox" checked={onlyOpen} onChange={(e)=>setOnlyOpen(e.target.checked)}
                  style={{ accentColor:T.brand, width:16, height:16 }} />
                Ouverts seulement
              </label>
            )}
            <button onClick={()=>setShowCfg(!showCfg)} style={{ background:"none", border:"none",
              color:T.brand, fontSize:12, fontWeight:600, cursor:"pointer" }}>
              {showCfg?"▲ Familles":"▼ Familles"}
            </button>
          </div>
          {showCfg && (
            <div style={{ marginTop:11, display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(210px,1fr))", gap:3 }}>
              {catKeys.map((k)=>{
                const c=catalog[k], on=!!cats[k];
                return (
                  <div key={k} onClick={()=>setCats(Object.assign({},cats,{[k]:!on}))}
                    style={{ display:"flex", alignItems:"center", gap:8, padding:"8px 9px",
                              borderRadius:6, cursor:"pointer", background:on?c.color+"12":"transparent" }}>
                    <div style={{ width:16, height:16, borderRadius:4, flexShrink:0,
                                   border:"2px solid "+(on?c.color:T.line), background:on?c.color:"#fff",
                                   display:"flex", alignItems:"center", justifyContent:"center",
                                   color:"#fff", fontSize:10, fontWeight:900 }}>{on?"✓":""}</div>
                    <span style={{ fontSize:12.5, fontWeight:650, color:on?c.color:T.mute }}>{c.label}</span>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {error && (
        <div style={{ background:T.hotLt, border:"1px solid "+T.hot+"44", borderRadius:7,
                       padding:"12px 15px", marginBottom:13, fontSize:13, color:T.hot, lineHeight:1.55 }}>{error}</div>
      )}

      {shown.length===0 ? (
        <div style={{ textAlign:"center", padding:"46px 18px", background:T.card,
                       border:"1px solid "+T.line, borderRadius:9 }}>
          <div style={{ fontSize:40, marginBottom:10 }}>◎</div>
          <div style={{ fontWeight:700, color:T.ink, fontSize:16, marginBottom:5 }}>{empty}</div>
          <div style={{ color:T.mute, fontSize:13 }}>Lancez un scan depuis la barre de commande</div>
        </div>
      ) : shown.map((a)=>(
        <Card key={a.id} item={a} mode="flux" open={open} setOpen={setOpen}
          ai={aiCache[a.id]} aiBusy={!!aiBusy[a.id]} inPipe={pipeline.some((x)=>x.id===a.id)}
          onAnalyze={onAnalyze} onAdd={onAdd} onUpdate={()=>{}} onRemove={()=>{}} hasKey={hasKey}
          links={linksFor?linksFor(a):null} {...(briefFor?briefFor(a):{})} />
      ))}
    </div>
  );
}

/* ─── SIGNAUX D'AFFAIRES ──────────────────────────────────────── */
function TabAffaires({ affaires, onImport, open, setOpen, aiCache, aiBusy, pipeline, onAnalyze, onAdd, hasKey, linksFor, importMsg, briefFor }){
  const semaines = useMemo(()=>Array.from(new Set(affaires.map((a)=>a.semaine).filter(Boolean))).sort().reverse(),[affaires]);
  const [sem,setSem]=useState("");
  const [statut,setStatut]=useState("Go");
  const fileRef=useRef(null);
  const semActive = sem || semaines[0] || "";
  const ofWeek = affaires.filter((a)=>!semActive || a.semaine===semActive);
  const count = (st)=>ofWeek.filter((a)=>a.statut===st).length;
  const shown = ofWeek.filter((a)=>!statut || a.statut===statut)
    .slice().sort((a,b)=>b.score-a.score);

  return (
    <div>
      <div style={{ background:T.card, border:"1px solid "+T.line, borderRadius:9, padding:15, marginBottom:13 }}>
        <div style={{ display:"flex", alignItems:"flex-end", gap:11, flexWrap:"wrap" }}>
          <div style={{ flex:1, minWidth:170 }}>
            <Field label="Semaine">
              <select value={semActive} onChange={(e)=>setSem(e.target.value)} style={inputStyle}>
                {semaines.length===0 && <option value="">—</option>}
                {semaines.map((w)=><option key={w} value={w}>{w}</option>)}
              </select>
            </Field>
          </div>
          <Btn kind="plain" onClick={()=>fileRef.current && fileRef.current.click()}>Importer la semaine</Btn>
          <input ref={fileRef} type="file" accept=".json,application/json" style={{ display:"none" }}
            onChange={(e)=>{ const f=e.target.files&&e.target.files[0]; if(f) onImport(f); e.target.value=""; }} />
        </div>
        <div style={{ marginTop:12, display:"flex", gap:7, flexWrap:"wrap", alignItems:"center" }}>
          <span style={{ fontSize:10, color:T.mute, fontWeight:700, textTransform:"uppercase", letterSpacing:0.6 }}>Statut</span>
          {["Go","À qualifier","Hors cible",""].map((st)=>{
            const on=statut===st, c=st?AF_STATUT[st].color:T.ink;
            return <Chip key={st||"tous"} active={on} bg={on?c:"#fff"} color={on?"#fff":T.mute}
              onClick={()=>setStatut(st)}>{st||"Tous"} · {st?count(st):ofWeek.length}</Chip>;
          })}
        </div>
        {importMsg && (
          <div style={{ marginTop:11, fontSize:12, fontWeight:600,
                         color:importMsg.ok?T.ok:T.hot }}>{importMsg.text}</div>
        )}
        <div style={{ marginTop:10, fontSize:11.5, color:T.mute, lineHeight:1.55 }}>
          Chaque mardi, la veille vous envoie le fichier de la semaine : importez-le ici. Le message LinkedIn s'envoie
          vous-même, après avoir vérifié la bonne personne sur son profil.
        </div>
      </div>

      {shown.length===0 ? (
        <div style={{ textAlign:"center", padding:"46px 18px", background:T.card,
                       border:"1px solid "+T.line, borderRadius:9 }}>
          <div style={{ fontSize:40, marginBottom:10 }}>◎</div>
          <div style={{ fontWeight:700, color:T.ink, fontSize:16 }}>Aucun signal pour ce filtre</div>
        </div>
      ) : shown.map((a)=>(
        <Card key={a.id} item={a} mode="flux" open={open} setOpen={setOpen}
          ai={aiCache[a.id]} aiBusy={!!aiBusy[a.id]} inPipe={pipeline.some((x)=>x.id===a.id)}
          onAnalyze={onAnalyze} onAdd={onAdd} onUpdate={()=>{}} onRemove={()=>{}} hasKey={hasKey}
          links={linksFor(a)} {...(briefFor?briefFor(a):{})} />
      ))}
    </div>
  );
}

/* ─── SÉQUENCE LINKEDIN ───────────────────────────────────────── */
const HOOKS = {
  "croissance externe":"L'intégration d'une nouvelle société pose souvent la question de la centralisation des comptes et de la visibilité sur la trésorerie.",
  "investissement":"Un projet de cette ampleur change souvent les volumes à encaisser, à payer et à financer.",
  "nomination":"Une prise de poste est souvent le bon moment pour faire le point sur l'organisation des flux.",
  "international":"Un nouveau pays, c'est souvent de nouveaux besoins en paiements internationaux et en change.",
  "réseau franchise":"Un réseau qui grandit doit pouvoir encaisser et prélever ses franchisés simplement.",
  "subvention":"Les financements publics arrivent souvent après les dépenses, ce qui pèse sur la trésorerie.",
  "reprise":"Une reprise est souvent l'occasion de remettre à plat l'organisation bancaire.",
  "direction":"Une nouvelle direction est souvent le bon moment pour revoir l'organisation des flux.",
  "croissance":"Une phase de croissance change souvent les volumes à encaisser et à financer.",
};
function followUps(item){
  const t = norm(item.type||item.categorie||(item.eval&&item.eval.categories&&item.eval.categories[0])||"");
  const key = Object.keys(HOOKS).find((k)=>t.indexOf(norm(k))!==-1);
  const hook = key ? HOOKS[key] : "Votre actualité m'a fait penser que le sujet des flux et de la trésorerie pouvait être d'actualité chez vous.";
  return {

/* ─── BRIEFING 7 BLOCS ────────────────────────────────────────── */
const BLOCS = ["Structure légale et gouvernance","Profil économique et financier","Flux et infrastructure de paiement",
  "Trésorerie et cash management","International et change","ERP, TMS et intégration","Écosystème PSP et partenaires"];

async function runBriefing(apiKey, it){
  const ctx = "Entreprise : "+(it.entreprise||it.societe||it.acheteur)+
    (it.lieu?"\nLocalisation : "+it.lieu:"")+(it.ville?"\nVille : "+it.ville:"")+
    "\nSignal déclencheur : "+(it.fait||it.signal||it.objet||"")+
    (it.angle?"\nAngle pressenti : "+it.angle:"");
  const data = await callClaude(apiKey,{
    model:MODEL, max_tokens:7000,
    tools:[{ type:"web_search_20250305", name:"web_search", max_uses:8 }],
    system:"Tu prépares des dossiers pré-rendez-vous pour un responsable Ingénierie Flux, Paiements & International d'une banque régionale des Hauts-de-France. Sources publiques uniquement (BODACC, Pappers, Societe.com, presse régionale, site de l'entreprise, communiqués). N'invente jamais un chiffre, un nom ou une banque : écris « Non trouvé » quand l'information manque, et signale ce qui est une hypothèse. Paraphrase, ne recopie pas les articles. Tu réponds UNIQUEMENT en JSON valide, sans markdown ni backtick.",
    messages:[{ role:"user", content:
      "Prépare un briefing pré-RDV en 7 blocs sur cette entreprise. Fais une recherche ciblée par bloc.\n\n"+ctx+"\n\n"+
      "Blocs, dans cet ordre : "+BLOCS.map((b,i)=>(i+1)+". "+b).join(" ; ")+".\n\n"+
      "Retourne exactement ce JSON :\n"+
      '{"resume":"3 phrases : qui ils sont, pourquoi maintenant, la meilleure porte d\'entrée",'+
      '"blocs":[{"titre":"nom du bloc","points":["fait court et sourcé, ou Non trouvé"],"confiance":"élevée|moyenne|faible"}],'+
      '"questions":["3 questions ouvertes prêtes à poser à l\'oral, qui font parler des irritants"],'+
      '"hypotheses":["2 hypothèses d\'opportunité, chiffrées seulement si une base publique le permet"],'+
      '"risque":"le principal risque concurrentiel (banque historique, PSP en place)",'+
      '"documents":["documents à apporter au RDV"],'+
      '"sources":[{"titre":"nom de la source","url":"lien"}]}' }],
  });
  const txt=(data.content||[]).filter((b)=>b.type==="text").map((b)=>b.text).join("\n");
  const parsed=extractJSON(txt);
  if(!parsed || !Array.isArray(parsed.blocs)) throw new Error("réponse illisible");
  return Object.assign(parsed,{ entreprise:it.entreprise||it.societe||it.acheteur, at:todayISO() });
}

function briefText(b){
  const L=["BRIEFING PRÉ-RDV — "+b.entreprise+" ("+fmtDate(b.at)+")","",b.resume||"",""];
  (b.blocs||[]).forEach((x,i)=>{ L.push((i+1)+". "+x.titre+(x.confiance?" [confiance "+x.confiance+"]":"")); (x.points||[]).forEach((p)=>L.push("  - "+p)); L.push(""); });
  L.push("PISTES POUR LE RENDEZ-VOUS");
  L.push("Questions :"); (b.questions||[]).forEach((q)=>L.push("  - "+q));
  L.push("Hypothèses d'opportunité :"); (b.hypotheses||[]).forEach((q)=>L.push("  - "+q));
  if(b.risque) L.push("Risque concurrentiel : "+b.risque);
  L.push("Documents à apporter :"); (b.documents||[]).forEach((q)=>L.push("  - "+q));
  L.push(""); L.push("Sources :"); (b.sources||[]).forEach((x)=>L.push("  - "+(x.titre||"")+" "+(x.url||"")));
  L.push(""); L.push("Sources publiques uniquement — à vérifier avant usage.");
  return L.join("\n");
}

/* ─── CONVERSION ──────────────────────────────────────────────── */
const FUNNEL = [
  { k:"contacte", l:"Contactés", lvl:1 }, { k:"connecte", l:"Connectés", lvl:2 },
  { k:"rdv", l:"RDV obtenus", lvl:3 }, { k:"opportunite", l:"Opportunités", lvl:4 }, { k:"gagne", l:"Gagnés", lvl:5 },
];
const LEVEL = { a_approcher:0, contacte:1, connecte:2, rdv:3, opportunite:4, gagne:5, perdu:0 };
function reached(a){
  let m = LEVEL[a.status]||0;
  Object.keys(a.stageDates||{}).forEach((k)=>{ if((LEVEL[k]||0)>m) m=LEVEL[k]; });
  if(a.sentAt && m<1) m=1; if(a.acceptedAt && m<2) m=2;
  return m;
}
const pct = (a,b) => b ? Math.round(a*100/b)+" %" : "—";

function TabConversion({ pipeline, onExport }){
  const pros = pipeline.filter((a)=>a.kind!=="ao");
  const aos = pipeline.filter((a)=>a.kind==="ao");
  const lv = pros.map(reached);
  const nAt = (l) => lv.filter((x)=>x>=l).length;
  const steps = [{ l:"Pistes suivies", n:pros.length }].concat(FUNNEL.map((f)=>({ l:f.l, n:nAt(f.lvl) })));
  const max = Math.max(1, pros.length);
  const group = (keyFn) => {
    const g={};
    pros.forEach((a)=>{ const k=keyFn(a)||"Autre"; if(!g[k]) g[k]={ k, n:0, c:0, r:0, o:0 };
      const r=reached(a); g[k].n++; if(r>=1) g[k].c++; if(r>=3) g[k].r++; if(r>=4) g[k].o++; });
    return Object.values(g).sort((x,y)=>y.r-x.r||y.n-x.n);
  };
  const byType = group((a)=>a.type||(a.kind==="sig"?a.famille:a.categorie)||KIND_LABEL[a.kind]);
  const bySource = group((a)=>KIND_LABEL[a.kind]);
  const delays = pros.filter((a)=>a.sentAt && a.stageDates && a.stageDates.rdv)
    .map((a)=>(new Date(a.stageDates.rdv)-new Date(a.sentAt))/86400000).filter((d)=>d>=0);
  const avgDelay = delays.length ? Math.round(delays.reduce((x,y)=>x+y,0)/delays.length) : null;
  const aoDep = aos.filter((a)=>["depose","gagne","perdu"].indexOf(a.status)!==-1).length;
  const aoWin = aos.filter((a)=>a.status==="gagne").length;
  const card = { background:T.card, border:"1px solid "+T.line, borderRadius:9, padding:16, marginBottom:14 };
  const th = { textAlign:"left", fontSize:11, color:T.mute, fontWeight:700, padding:"6px 8px", borderBottom:"1px solid "+T.line };
  const td = { fontSize:12.5, color:T.body, padding:"7px 8px", borderBottom:"1px solid "+T.line, fontVariantNumeric:"tabular-nums" };
  const Table = ({ rows, title }) => (
    <div style={card}>
      <div style={{ fontWeight:700, color:T.ink, fontSize:14, marginBottom:9 }}>{title}</div>
      {rows.length===0 ? <div style={{ fontSize:13, color:T.mute }}>Pas encore de données.</div> : (
      <div className="scroll-x"><table style={{ width:"100%", borderCollapse:"collapse", minWidth:420 }}>
        <thead><tr><th style={th}></th><th style={th}>Pistes</th><th style={th}>Contactées</th><th style={th}>RDV</th><th style={th}>RDV / contact</th><th style={th}>Opportunités</th></tr></thead>
        <tbody>{rows.map((r)=>(<tr key={r.k}><td style={Object.assign({},td,{ fontWeight:600, color:T.ink })}>{r.k}</td><td style={td}>{r.n}</td><td style={td}>{r.c}</td><td style={td}>{r.r}</td><td style={Object.assign({},td,{ fontWeight:700, color:r.r?T.ok:T.mute })}>{pct(r.r,r.c)}</td><td style={td}>{r.o}</td></tr>))}</tbody>
      </table></div>)}
    </div>
  );
  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", gap:9, flexWrap:"wrap", marginBottom:14 }}>
        <div style={{ fontWeight:700, color:T.ink, fontSize:17 }}>Conversion de la prospection</div>
        <Btn kind="plain" onClick={onExport} disabled={pipeline.length===0}>Export Pilotage</Btn>
      </div>
      <div style={card}>
        <div style={{ fontWeight:700, color:T.ink, fontSize:14, marginBottom:4 }}>Entonnoir des pistes (hors appels d'offres)</div>
        <div style={{ fontSize:12, color:T.mute, marginBottom:12 }}>Une piste compte à chaque étape qu'elle a atteinte, même si elle a été close ensuite.</div>
        {steps.map((s,i)=>(
          <div key={i} style={{ display:"grid", gridTemplateColumns:"minmax(92px,120px) 1fr 76px", gap:9, alignItems:"center", marginBottom:7 }}>
            <div style={{ fontSize:12.5, color:T.body, fontWeight:600 }}>{s.l}</div>
            <div style={{ background:T.bg, borderRadius:5, height:22, overflow:"hidden" }}>
              <div style={{ width:(s.n*100/max)+"%", minWidth:s.n?4:0, height:"100%", background:i===0?T.mute:i>=3?T.ok:T.cool, borderRadius:5 }} />
            </div>
            <div style={{ fontSize:12.5, color:T.ink, fontWeight:700, fontVariantNumeric:"tabular-nums", textAlign:"right" }}>
              {s.n}{i>0 && <span style={{ color:T.mute, fontWeight:500 }}> · {pct(s.n,steps[i-1].n)}</span>}
            </div>
          </div>
        ))}
        <div style={{ display:"flex", gap:18, flexWrap:"wrap", marginTop:12, fontSize:12.5, color:T.body }}>
          <span>RDV / pistes contactées : <strong style={{ color:T.ok }}>{pct(nAt(3),nAt(1))}</strong></span>
          <span>Délai moyen demande → RDV : <strong>{avgDelay===null?"—":avgDelay+" j"}</strong></span>
          <span>Appels d'offres déposés : <strong>{aoDep}</strong> · gagnés : <strong>{aoWin}</strong> ({pct(aoWin,aoDep)})</span>
        </div>
      </div>
      <Table rows={byType} title="Par type de signal" />
      <Table rows={bySource} title="Par source" />
    </div>
  );
}

/* ─── PIPELINE ────────────────────────────────────────────────── */
function TabPipeline({ pipeline, open, setOpen, aiCache, aiBusy, onAnalyze, onUpdate, onRemove, hasKey, linksFor, briefFor }){
  const due=pipeline.filter((a)=>a.relance && String(a.relance).substring(0,10)<=todayISO() && ['gagne','perdu'].indexOf(a.status)===-1);
  function exportCsv(){
    const head=["Type","Référence","Objet","Entité","Départements","Parution","Date limite","Score","Statut","Relance","Notes","URL"];
    const rows=pipeline.map((a)=>[
      a.kind==="ao"?"Appel d'offres":a.kind==="sig"?"BODACC":a.kind==="affaire"?"Signal d'affaires":"Presse",
      a.ref||a.id, a.objet, a.acheteur, a.depts.join(" "),
      fmtDate(a.dateParution), fmtDate(a.dateLimite),
      a.eval?a.eval.score:a.kind==="affaire"?a.score+"/12":"", STATUS[a.status]?STATUS[a.status].label:a.status,
      a.relance||"", a.notes||"", a.url||"" ]);
    const csv=[head].concat(rows).map((r)=>r.map((c)=>{
      const s=String(c==null?"":c); return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(";")).join("\n");
    const blob=new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const el=document.createElement("a");
    el.href=url; el.download="pipeline-radar-business.csv"; el.style.display="none";
    document.body.appendChild(el); el.click();
    setTimeout(()=>{ document.body.removeChild(el); URL.revokeObjectURL(url); },100);
  }
  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center",
                     marginBottom:16, flexWrap:"wrap", gap:9 }}>
        <div style={{ fontWeight:700, color:T.ink, fontSize:17 }}>
          {pipeline.length} dossier{pipeline.length!==1?"s":""} suivi{pipeline.length!==1?"s":""}
        </div>
        <div style={{ display:"flex", gap:7, flexWrap:"wrap" }}>
          <Btn onClick={()=>exportPilotage(pipeline)} kind="plain" disabled={pipeline.length===0}>Export Pilotage</Btn>
          <Btn onClick={exportCsv} kind="plain" disabled={pipeline.length===0}>Export CSV</Btn>
        </div>
      </div>
      {due.length>0 && (
        <div style={{ background:T.warmLt, border:"1px solid "+T.warm+"55", borderRadius:9, padding:"12px 14px", marginBottom:16 }}>
          <div style={{ fontWeight:700, color:T.warm, fontSize:13.5, marginBottom:7 }}>À faire aujourd'hui · {due.length}</div>
          {due.map((a)=>(
            <div key={a.id} onClick={()=>setOpen(a.id)} style={{ fontSize:12.5, color:T.body, padding:"4px 0", cursor:"pointer" }}>
              <strong style={{ color:T.ink }}>{a.entreprise||a.societe||a.acheteur}</strong> — {a.nextAction||"Relance prévue"} ({fmtDate(a.relance)})
            </div>
          ))}
        </div>
      )}
      {pipeline.length===0 ? (
        <div style={{ textAlign:"center", padding:"46px 18px", background:T.card,
                       border:"1px solid "+T.line, borderRadius:9, color:T.mute }}>
          <div style={{ fontSize:40, marginBottom:10 }}>◻︎</div>
          <div style={{ fontWeight:600, color:T.body }}>Pipeline vide</div>
        </div>
      ) : Object.keys(STATUS).map((k)=>{
        const items=pipeline.filter((a)=>a.status===k);
        if(!items.length) return null;
        const sc=STATUS[k];
        return (
          <div key={k} style={{ marginBottom:22 }}>
            <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:9 }}>
              <div style={{ width:9, height:9, borderRadius:"50%", background:sc.color }} />
              <span style={{ fontWeight:700, color:sc.color, fontSize:14 }}>{sc.label}</span>
              <Chip bg={sc.bg} color={sc.color}>{items.length}</Chip>
            </div>
            {items.map((a)=>(
              <Card key={a.id} item={a} mode="pipe" open={open} setOpen={setOpen}
                ai={aiCache[a.id]} aiBusy={!!aiBusy[a.id]} inPipe={true}
                onAnalyze={onAnalyze} onAdd={()=>{}} onUpdate={onUpdate} onRemove={onRemove} hasKey={hasKey}
                links={linksFor?linksFor(a):null} {...(briefFor?briefFor(a):{})} />
            ))}
          </div>
        );
      })}
    </div>
  );
}

/* ─── CALENDRIER ──────────────────────────────────────────────── */
function TabCalendrier({ pipeline, month, setMonth }){
  const y=month.getFullYear(), m=month.getMonth();
  const first=new Date(y,m,1).getDay(), dim=new Date(y,m+1,0).getDate();
  const pad=first===0?6:first-1;
  const cells=Array(pad).fill(null).concat(Array.from({length:dim},(_,i)=>i+1));
  const today=new Date().toISOString().split("T")[0];

  const byDate=useMemo(()=>{
    const map={};
    pipeline.forEach((a)=>{ [a.dateLimite,a.relance].forEach((d)=>{
      if(!d) return; const k=String(d).substring(0,10);
      if(!map[k]) map[k]=[]; if(map[k].indexOf(a)===-1) map[k].push(a); }); });
    return map;
  },[pipeline]);

  const upcoming=useMemo(()=>{
    const now=new Date(), lim=new Date(); lim.setDate(lim.getDate()+60);
    return pipeline.map((a)=>({a,d:a.dateLimite||a.relance}))
      .filter((x)=>{ if(!x.d) return false; const dt=new Date(x.d); return dt>=now&&dt<=lim; })
      .sort((x,z)=>new Date(x.d)-new Date(z.d));
  },[pipeline]);

  return (
    <div className="calgrid" style={{ display:"grid", gridTemplateColumns:"1fr 280px", gap:16 }}>
      <div style={{ background:T.card, border:"1px solid "+T.line, borderRadius:9, padding:16 }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14 }}>
          <Btn kind="plain" onClick={()=>setMonth(new Date(y,m-1))} style={{ padding:"7px 14px" }}>‹</Btn>
          <div style={{ fontWeight:700, color:T.ink, fontSize:16 }}>
            {month.toLocaleDateString("fr-FR",{month:"long",year:"numeric"}).replace(/^./,(c)=>c.toUpperCase())}
          </div>
          <Btn kind="plain" onClick={()=>setMonth(new Date(y,m+1))} style={{ padding:"7px 14px" }}>›</Btn>
        </div>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:3 }}>
          {["L","M","M","J","V","S","D"].map((d,i)=>(
            <div key={i} style={{ textAlign:"center", fontSize:11, fontWeight:700, color:T.mute, paddingBottom:6 }}>{d}</div>
          ))}
          {cells.map((day,i)=>{
            if(!day) return <div key={"p"+i} />;
            const ds=y+"-"+String(m+1).padStart(2,"0")+"-"+String(day).padStart(2,"0");
            const ev=byDate[ds]||[], isToday=ds===today, isPast=ds<today;
            return (
              <div key={day} style={{ minHeight:52, padding:"4px 2px", borderRadius:6, textAlign:"center",
                background:isToday?T.ink:ev.length?T.brandLt:"transparent",
                color:isToday?"#fff":isPast?"#CBD5E1":T.body,
                border:"1px solid "+(ev.length&&!isToday?T.brand+"44":"transparent") }}>
                <div style={{ fontSize:12, fontWeight:isToday?700:400 }}>{day}</div>
                {ev.slice(0,2).map((a,j)=>(
                  <div key={j} title={a.objet} style={{ fontSize:8, marginTop:1, padding:"1px 2px",
                    borderRadius:3, color:"#fff", background:STATUS[a.status]?STATUS[a.status].color:T.brand,
                    overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
                    {a.acheteur.substring(0,11)}
                  </div>
                ))}
                {ev.length>2 && <div style={{ fontSize:9, color:T.brand }}>+{ev.length-2}</div>}
              </div>
            );
          })}
        </div>
      </div>
      <div style={{ background:T.card, border:"1px solid "+T.line, borderRadius:9, padding:15 }}>
        <div style={{ fontWeight:700, color:T.ink, fontSize:14, marginBottom:12 }}>Échéances à 60 jours</div>
        {upcoming.length===0 ? (
          <div style={{ color:T.mute, fontSize:13, textAlign:"center", padding:"20px 0" }}>Rien de programmé</div>
        ) : upcoming.map((x)=>{
          const dl=daysLeft(x.d), sc=STATUS[x.a.status];
          return (
            <div key={x.a.id+x.d} style={{ borderBottom:"1px solid "+T.line, paddingBottom:9, marginBottom:9 }}>
              <div style={{ fontSize:12, fontWeight:600, color:T.body, lineHeight:1.35 }}>
                {x.a.objet.substring(0,58)}{x.a.objet.length>58?"…":""}
              </div>
              <div style={{ fontSize:11, color:T.mute, marginTop:3 }}>{x.a.acheteur.substring(0,32)}</div>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginTop:5 }}>
                {sc && <Chip bg={sc.bg} color={sc.color}>{sc.label}</Chip>}
                <span style={{ fontSize:12, fontWeight:700, color:urgColor(dl) }}>
                  {dl===0?"Aujourd'hui":dl===1?"Demain":"J-"+dl}
                </span>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

          Facultative. Sans clé, les boutons d'analyse et de briefing copient un prompt à coller dans Claude, ChatGPT ou MAiA,

          {apiKey ? "Clé active — analyse IA et veille presse disponibles"
                  : "Mode sans clé : appels d'offres, BODACC, signaux et briefings importés, prompts à copier"}
        </div>
      </div>

      <div style={{ background:T.card, border:"1px solid "+T.line, borderRadius:9, padding:18, marginBottom:16 }}>
        <div style={{ fontWeight:700, color:T.ink, fontSize:14, marginBottom:4 }}>Journal de connexion</div>
        <div style={{ fontSize:11, color:T.mute, marginBottom:11 }}>
          {meta ? "Dernier scan : "+meta : "Aucun scan lancé."}
        </div>
        <div style={{ background:"#0F172A", color:"#94E2B8", fontFamily:"ui-monospace,Menlo,monospace",
                       fontSize:11, lineHeight:1.65, padding:13, borderRadius:7,
                       maxHeight:280, overflowY:"auto", whiteSpace:"pre-wrap" }}>
          {log.length ? log.join("\n") : "—"}
        </div>
      </div>

      <div style={{ background:T.card, border:"1px solid "+T.line, borderRadius:9, padding:18 }}>
        <div style={{ fontWeight:700, color:T.ink, fontSize:14, marginBottom:4 }}>Données locales</div>
        <div style={{ fontSize:12, color:T.mute, marginBottom:12, lineHeight:1.6 }}>
          Pipeline, notes, analyses et réglages sont conservés dans ce navigateur. Exportez régulièrement
          le CSV depuis l'onglet Pipeline si ces données comptent.
        </div>
        <Btn onClick={onWipe} kind="danger">Effacer toutes les données locales</Btn>

  );
}

/* ══════════════════════════════════════════════════════════════
   APPLICATION
   ══════════════════════════════════════════════════════════════ */
function App(){
  const [tab,setTab]=useState("affaires");
  const [affRaw,setAffRaw]=useState(()=>LS.get("radar-affaires",null)||AFFAIRES_DEFAUT);
  const [importMsg,setImportMsg]=useState(null);
  const [items,setItems]=useState([]);
  const [rawAO,setRawAO]=useState([]);
  const [rawSIG,setRawSIG]=useState([]);
  const [presse,setPresse]=useState([]);
  const [loading,setLoading]=useState(false);
  const [progress,setProgress]=useState("");
  const [error,setError]=useState(null);
  const [meta,setMeta]=useState(null);
  const [log,setLog]=useState([]);

  const [apiKey,setApiKeyState]=useState(()=>LS.getRaw("radar-key",""));
  const [depts,setDepts]=useState(()=>LS.get("radar-depts",ALL_DEPTS));
  const [days,setDays]=useState(()=>LS.get("radar-days",30));
  const [pages,setPages]=useState(()=>LS.get("radar-pages2",20));
  const [sources,setSources]=useState(()=>LS.get("radar-sources",{boamp:true,bodacc:true,presse:true}));
  const [aoCats,setAoCats]=useState(()=>LS.get("radar-aocats",(function(){const o={};AO_KEYS.forEach((k)=>{o[k]=true;});return o;})()));
  const [sigCats,setSigCats]=useState(()=>LS.get("radar-sigcats",(function(){const o={};SIG_KEYS.forEach((k)=>{o[k]=true;});return o;})()));
  const [minScore,setMinScore]=useState(()=>LS.get("radar-min",20));
  const [sigMinScore,setSigMinScore]=useState(()=>LS.get("radar-sigmin",20));
  const [onlyOpen,setOnlyOpen]=useState(()=>LS.get("radar-open",true));
  const [sortBy,setSortBy]=useState("score");
  const [sigSortBy,setSigSortBy]=useState("score");

  const [pipeline,setPipeline]=useState(()=>LS.get("radar-pipe",[]));
  const [aiCache,setAiCache]=useState(()=>LS.get("radar-ai",{}));
  const [aiBusy,setAiBusy]=useState({});
  const [open,setOpen]=useState(null);
  const [month,setMonth]=useState(new Date());

  const logRef=useRef([]);
  const addLog=useCallback((l)=>{ logRef.current=logRef.current.concat([l]).slice(-180); setLog(logRef.current); },[]);

  const setApiKey=useCallback((k)=>{ setApiKeyState(k); LS.setRaw("radar-key",k); },[]);

  useEffect(()=>{ LS.set("radar-pipe",pipeline); },[pipeline]);
  useEffect(()=>{ LS.set("radar-affaires",affRaw); },[affRaw]);
  const affaires=useMemo(()=>affRaw.map(normalizeAffaire).filter(Boolean),[affRaw]);

  /* Import du fichier hebdomadaire : remplace la semaine importée, garde 12 semaines */
  const onImport=useCallback((file)=>{
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const j=JSON.parse(String(rd.result||""));
        const rows=Array.isArray(j)?j:(j&&(j.rows||j.data||j.results))||[];
        const ok=rows.filter((r)=>r&&typeof r==="object"&&r.entreprise&&r.statut);
        if(!ok.length) throw new Error("aucun signal reconnu dans ce fichier");
        const weeks=Array.from(new Set(ok.map((r)=>r.semaine).filter(Boolean)));
        setAffRaw((prev)=>{
          const kept=prev.filter((r)=>weeks.indexOf(r.semaine)===-1);
          const all=ok.concat(kept);
          const keep=Array.from(new Set(all.map((r)=>r.semaine).filter(Boolean))).sort().reverse().slice(0,12);
          return all.filter((r)=>!r.semaine||keep.indexOf(r.semaine)!==-1);
        });
        setImportMsg({ ok:true, text:ok.length+" signaux importés"+(weeks.length?" ("+weeks.join(", ")+")":"")+"." });
      }catch(e){ setImportMsg({ ok:false, text:"Import impossible : "+((e&&e.message)||"fichier illisible") }); }
    };
    rd.onerror=()=>setImportMsg({ ok:false, text:"Import impossible : lecture du fichier refusée" });
    rd.readAsText(file);
  },[]);
  useEffect(()=>{ LS.set("radar-ai",aiCache); },[aiCache]);
  useEffect(()=>{ LS.set("radar-depts",depts); },[depts]);
  useEffect(()=>{ LS.set("radar-days",days); },[days]);
  useEffect(()=>{ LS.set("radar-pages2",pages); },[pages]);
  useEffect(()=>{ LS.set("radar-sources",sources); },[sources]);
  useEffect(()=>{ LS.set("radar-aocats",aoCats); },[aoCats]);
  useEffect(()=>{ LS.set("radar-sigcats",sigCats); },[sigCats]);
  useEffect(()=>{ LS.set("radar-min",minScore); },[minScore]);
  useEffect(()=>{ LS.set("radar-sigmin",sigMinScore); },[sigMinScore]);
  useEffect(()=>{ LS.set("radar-open",onlyOpen); },[onlyOpen]);

  /* Re-scoring à chaud */
  useEffect(()=>{
    const out=[];
    rawAO.forEach((r)=>{ const n=normalizeAO(r); if(!n) return;
      if(depts.length && n.depts.length && !n.depts.some((d)=>depts.indexOf(d)!==-1)) return;
      const ev=scoreItem(n.hay,AO_CATS,AO_KEYS,aoCats); if(ev) out.push(Object.assign({},n,{eval:ev})); });
    rawSIG.forEach((r)=>{ const n=normalizeSignal(r); if(!n) return;
      if(depts.length && n.depts.length && !n.depts.some((d)=>depts.indexOf(d)!==-1)) return;
      const ev=scoreItem(n.hay,SIG_CATS,SIG_KEYS,sigCats); if(ev) out.push(Object.assign({},n,{eval:ev})); });
    presse.forEach((p)=>out.push(p));
    setItems(out);
  },[rawAO,rawSIG,presse,aoCats,sigCats,depts]);

  /* Croisement : une même entreprise vue dans plusieurs sources */
  const linkMap=useMemo(()=>{
    const map={};
    const others=items.map((o)=>({ o, k:entityKey(o.kind==="ao"?o.acheteur:o.societe) }));
    const add=(id,l)=>{ if(!map[id]) map[id]=[]; if(map[id].indexOf(l)===-1) map[id].push(l); };
    affaires.forEach((a)=>{
      const ka=entityKey(a.entreprise);
      others.forEach((x)=>{ if(sameEntity(ka,x.k)){ add(a.id,KIND_LABEL[x.o.kind]); add(x.o.id,KIND_LABEL.affaire); } });
    });
    return map;
  },[items,affaires]);
  const linksFor=useCallback((a)=>linkMap[a.id]||[],[linkMap]);

  /* Scan */
  const run=useCallback(async()=>{
    if(depts.length===0){ setError("Sélectionnez au moins un département."); return; }
    setLoading(true); setError(null); setMeta(null);
    setRawAO([]); setRawSIG([]); setPresse([]);
    logRef.current=[]; setLog([]);
    addLog("Scan — "+depts.join(",")+" · "+days+"j · "+pages*100+"/source");
    const via=[];
    try{
      if(sources.boamp){
        const r=await scanBOAMP(depts,days,pages,addLog,setProgress);
        if(r){ setRawAO(r.rows); via.push("BOAMP:"+r.via); } else addLog("BOAMP — aucune donnée");
      }
      if(sources.bodacc){
        const r=await scanBODACC(depts,days,pages,addLog,setProgress);
        if(r){ setRawSIG(r.rows); via.push("BODACC:"+r.via); } else addLog("BODACC — aucune donnée");
      }
      if(sources.presse){
        const r=await scanPresse(apiKey,depts,addLog,setProgress);
        setPresse(r); if(r.length) via.push("Presse:IA");
      }
      setMeta(via.join(" · ")||"aucune source");
      if(via.length===0) setError("Aucune source n'a répondu. Consultez le journal dans Réglages.");
      addLog("Scan terminé");
    }catch(e){
      setError("Erreur : "+((e&&e.message)||String(e)));
      addLog("EXCEPTION — "+((e&&e.message)||String(e)));
    }finally{ setLoading(false); setProgress(""); }
  },[depts,days,pages,sources,apiKey,addLog]);

  /* Analyse IA */
  const onAnalyze=useCallback(async(it)=>{
    if(aiCache[it.id]||aiBusy[it.id]) return;
    if(!apiKey){ setAiCache((p)=>Object.assign({},p,{[it.id]:{error:"clé API absente — onglet Réglages"}})); return; }
    setAiBusy((p)=>Object.assign({},p,{[it.id]:true}));
    const ctx = signalContext(it);
    try{
      const data=await callClaude(apiKey,{
        model:MODEL, max_tokens:1100,
        system:"Tu es analyste en développement commercial, spécialisé en services financiers aux entreprises et collectivités : moyens de paiement, encaissement, monétique, flux domestiques et internationaux, trésorerie, avantages salariés. Tu réponds UNIQUEMENT en JSON valide, sans markdown ni backtick.",
        messages:[{ role:"user", content:
          "Analyse ce signal d'affaires et retourne exactement ce JSON :\n"+
          '{"besoin":"le besoin réel derrière ce signal, en 2 phrases concrètes",'+
          '"angle":"l\'approche commerciale la plus efficace, formulée comme une action",'+
          '"interlocuteur":"la fonction précise à cibler (DAF, trésorier, DSI, régisseur, DRH, acheteur...)",'+
          '"vigilance":"le principal risque ou obstacle à anticiper",'+
          '"message":"une demande de connexion LinkedIn de moins de 300 caractères à l\'interlocuteur visé : vouvoiement, ton humain, qui rebondit sur le signal, sans jargon ni promesse"}\n\n'+ctx }],
      });
      const txt=data&&data.content&&data.content[0]&&data.content[0].text?data.content[0].text:"";
      const parsed=extractJSON(txt);
      setAiCache((p)=>Object.assign({},p,{[it.id]:parsed||{error:"réponse illisible"}}));
    }catch(e){
      setAiCache((p)=>Object.assign({},p,{[it.id]:{error:(e&&e.message)||"erreur"}}));
    }finally{ setAiBusy((p)=>Object.assign({},p,{[it.id]:false})); }
  },[aiCache,aiBusy,apiKey]);

  const onAdd=useCallback((it)=>{
    setPipeline((p)=> p.some((x)=>x.id===it.id) ? p
      : [Object.assign({},it,{status:it.kind==="ao"?"a_etudier":"a_approcher",notes:"",relance:null,addedAt:new Date().toISOString()})].concat(p));
  },[]);
  const onUpdate=useCallback((id,u)=>{ setPipeline((p)=>p.map((a)=>{
    if(a.id!==id) return a;
    const n=Object.assign({},a,u);
    if(u.status && u.status!==a.status) n.stageDates=Object.assign({},a.stageDates||{},{[u.status]:todayISO()});
    return n;
  })); },[]);

  /* Briefings 7 blocs, partagés par entreprise */
  const [briefCache,setBriefCache]=useState(()=>LS.get("radar-brief",{}));
  const [briefBusy,setBriefBusy]=useState({});
  const [briefOpen,setBriefOpen]=useState(null);
  const [briefErr,setBriefErr]=useState(null);
  useEffect(()=>{ LS.set("radar-brief",briefCache); },[briefCache]);
  /* Briefings préparés par la veille du mardi (champ « briefing » du fichier importé) */
  useEffect(()=>{
    const add={};
    affRaw.forEach((r)=>{ if(r && r.briefing && Array.isArray(r.briefing.blocs)){
      const k=entityKey(r.entreprise||"");
      add[k]=Object.assign({ entreprise:r.entreprise, at:r.date||todayISO() }, r.briefing);
    }});
    const keys=Object.keys(add); if(!keys.length) return;
    setBriefCache((prev)=>{ let ch=false; const n=Object.assign({},prev);
      keys.forEach((k)=>{ if(!n[k] || String(n[k].at||"")<String(add[k].at||"")){ n[k]=add[k]; ch=true; } });
      return ch?n:prev; });
  },[affRaw]);
  const bKey=(it)=>entityKey(it.entreprise||it.societe||it.acheteur||"");
  const doBrief=useCallback(async(it,force)=>{
    const k=bKey(it);
    if(!force && briefCache[k]){ setBriefOpen(k); return; }
    if(!apiKey){ setBriefErr("Clé API requise pour le briefing (onglet Réglages)."); return; }
    setBriefBusy((p)=>Object.assign({},p,{[k]:true})); setBriefErr(null);
    try{
      const b=await runBriefing(apiKey,it);
      setBriefCache((p)=>Object.assign({},p,{[k]:b})); setBriefOpen(k);
    }catch(e){ setBriefErr("Briefing impossible pour "+(it.entreprise||it.societe||"cette entreprise")+" : "+((e&&e.message)||"erreur")); }
    finally{ setBriefBusy((p)=>Object.assign({},p,{[k]:false})); }
  },[briefCache,apiKey]);
  const briefFor=useCallback((it)=>{ const k=bKey(it);
    return { onBrief:(x)=>doBrief(x,false), briefState:briefBusy[k]?"busy":briefCache[k]?"ok":"" };
  },[doBrief,briefBusy,briefCache]);
  const onRemove=useCallback((id)=>{ setPipeline((p)=>p.filter((a)=>a.id!==id)); },[]);

  const onWipe=useCallback(()=>{
    if(!window.confirm("Effacer le pipeline, les analyses et tous les réglages ? Cette action est définitive.")) return;
    ["radar-pipe","radar-ai","radar-depts","radar-days","radar-pages","radar-sources",
     "radar-pages2","radar-aocats","radar-sigcats","radar-min","radar-sigmin","radar-open","radar-key","radar-affaires","radar-brief"]
      .forEach((k)=>{ try{ localStorage.removeItem(k); }catch(_){} });
    window.location.reload();
  },[]);

  const nAO=items.filter((a)=>a.kind==="ao").length;
  const nSIG=items.filter((a)=>a.kind==="sig").length;
  const nPR=items.filter((a)=>a.kind==="presse").length;
  const urgent=pipeline.filter((a)=>{ const d=daysLeft(a.dateLimite||a.relance); return d!==null&&d>=0&&d<=7; }).length;
  const hasKey=!!apiKey;
  const dueCount=pipeline.filter((a)=>a.relance && String(a.relance).substring(0,10)<=todayISO() && ['gagne','perdu'].indexOf(a.status)===-1).length;
  const latestWeek=affaires.map((a)=>a.semaine).filter(Boolean).sort().reverse()[0]||"";
  const nGo=affaires.filter((a)=>a.statut==="Go"&&(!latestWeek||a.semaine===latestWeek)).length;

  const TABS=[
    { id:"affaires", label:"Signaux d'affaires"+(nGo?" · "+nGo+" Go":"") },
    { id:"ao", label:"Appels d'offres"+(nAO?" · "+nAO:"") },
    { id:"signaux", label:"Signaux dirigeants"+(nSIG?" · "+nSIG:"") },
    { id:"presse", label:"Presse & SI"+(nPR?" · "+nPR:"") },
    { id:"pipeline", label:"Pipeline"+(pipeline.length?" · "+pipeline.length:"")+(dueCount?" · "+dueCount+" à faire":"") },
    { id:"conversion", label:"Conversion" },
    { id:"calendrier", label:"Calendrier" },
    { id:"reglages", label:"Réglages" },
  ];
  const showBar=["ao","signaux","presse"].indexOf(tab)!==-1;

  return (
    <div style={{ minHeight:"100vh", background:T.bg }}>
      <header className="app" style={{ background:T.ink, color:"#fff", padding:"15px 20px",
                        display:"flex", alignItems:"center", justifyContent:"space-between", gap:12, flexWrap:"wrap" }}>
        <div style={{ display:"flex", alignItems:"center", gap:12 }}>
          <div style={{ width:38, height:38, borderRadius:10, background:T.brand,
                         display:"flex", alignItems:"center", justifyContent:"center", fontSize:19 }}>◎</div>
          <div>
            <div style={{ fontWeight:700, fontSize:17, letterSpacing:-0.2 }}>Radar Business</div>
            <div style={{ fontSize:11, opacity:0.62, marginTop:1 }}>
              Signaux d'affaires · Appels d'offres · Mouvements dirigeants · Presse
            </div>
          </div>
        </div>
        <div style={{ display:"flex", gap:6, fontSize:12 }}>
          {[{v:nGo,l:"Go",h:false},{v:nAO+nSIG+nPR,l:"signaux",h:false},{v:pipeline.length,l:"suivis",h:false},{v:urgent,l:"urgents",h:urgent>0}]
            .map((s,i)=>(
            <div key={i} style={{ padding:"5px 11px", borderRadius:18, display:"flex", alignItems:"center", gap:5,
              background:s.h?"rgba(220,38,38,.28)":"rgba(255,255,255,.1)",
              border:s.h?"1px solid rgba(220,38,38,.55)":"1px solid transparent" }}>
              <strong>{s.v}</strong><span style={{ opacity:0.7 }}>{s.l}</span>
            </div>
          ))}
        </div>
      </header>

      <nav className="scroll-x" style={{ background:T.ink, display:"flex", padding:"0 12px",
                                          borderBottom:"2px solid "+T.brand }}>
        {TABS.map((t)=>(
          <button key={t.id} onClick={()=>setTab(t.id)}
            style={{ background:"none", border:"none", cursor:"pointer", padding:"11px 14px",
                      fontSize:13, marginBottom:-2, whiteSpace:"nowrap",
                      color:tab===t.id?"#fff":"rgba(255,255,255,.52)",
                      fontWeight:tab===t.id?700:500,
                      borderBottom:"2px solid "+(tab===t.id?T.brand:"transparent") }}>
            {t.label}
          </button>
        ))}
      </nav>

      <main className="app" style={{ maxWidth:1340, margin:"0 auto", padding:20 }}>
        {showBar && (
          <CommandBar depts={depts} setDepts={setDepts} days={days} setDays={setDays}
            pages={pages} setPages={setPages} run={run} loading={loading} progress={progress}
            sources={sources} setSources={setSources} hasKey={hasKey} />
        )}

        {tab==="affaires" && (
          <TabAffaires affaires={affaires} onImport={onImport} importMsg={importMsg}
            open={open} setOpen={setOpen} aiCache={aiCache} aiBusy={aiBusy}
            pipeline={pipeline} onAnalyze={onAnalyze} onAdd={onAdd} hasKey={hasKey} linksFor={linksFor} briefFor={briefFor} />
        )}
        {tab==="ao" && (
          <TabFlux items={items} kinds={["ao"]} empty="Aucun appel d'offres détecté"
            cats={aoCats} setCats={setAoCats} catalog={AO_CATS} catKeys={AO_KEYS}
            minScore={minScore} setMinScore={setMinScore}
            onlyOpen={onlyOpen} setOnlyOpen={setOnlyOpen}
            sortBy={sortBy} setSortBy={setSortBy}
            open={open} setOpen={setOpen} aiCache={aiCache} aiBusy={aiBusy}
            pipeline={pipeline} onAnalyze={onAnalyze} onAdd={onAdd} error={error} hasKey={hasKey} linksFor={linksFor} briefFor={briefFor} />
        )}
        {tab==="signaux" && (
          <TabFlux items={items} kinds={["sig"]} empty="Aucun mouvement détecté"
            cats={sigCats} setCats={setSigCats} catalog={SIG_CATS} catKeys={SIG_KEYS}
            minScore={sigMinScore} setMinScore={setSigMinScore}
            onlyOpen={false} setOnlyOpen={null}
            sortBy={sigSortBy} setSortBy={setSigSortBy}
            open={open} setOpen={setOpen} aiCache={aiCache} aiBusy={aiBusy}
            pipeline={pipeline} onAnalyze={onAnalyze} onAdd={onAdd} error={null} hasKey={hasKey} linksFor={linksFor} briefFor={briefFor} />
        )}
        {tab==="presse" && (
          <TabFlux items={items} kinds={["presse"]} empty={hasKey?"Aucun signal presse":"Sans clé API, la presse arrive chaque mardi dans l'onglet Signaux d'affaires"}
            cats={null} setCats={null} catalog={null} catKeys={[]}
            minScore={0} setMinScore={()=>{}}
            onlyOpen={false} setOnlyOpen={null}
            sortBy="date" setSortBy={()=>{}}
            open={open} setOpen={setOpen} aiCache={aiCache} aiBusy={aiBusy}
            pipeline={pipeline} onAnalyze={onAnalyze} onAdd={onAdd} error={null} hasKey={hasKey} linksFor={linksFor} briefFor={briefFor} />
        )}
        {tab==="pipeline" && (
          <TabPipeline pipeline={pipeline} open={open} setOpen={setOpen}
            aiCache={aiCache} aiBusy={aiBusy} onAnalyze={onAnalyze}
            onUpdate={onUpdate} onRemove={onRemove} hasKey={hasKey} linksFor={linksFor} briefFor={briefFor} />
        )}
        {tab==="conversion" && <TabConversion pipeline={pipeline} onExport={()=>exportPilotage(pipeline)} />}
        {tab==="calendrier" && <TabCalendrier pipeline={pipeline} month={month} setMonth={setMonth} />}
        {tab==="reglages" && (
          <TabReglages apiKey={apiKey} setApiKey={setApiKey} items={items} pipeline={pipeline}
            meta={meta} log={log} onWipe={onWipe} />
        )}
      </main>
      {briefErr && (
        <div onClick={()=>setBriefErr(null)} style={{ position:"fixed", left:12, right:12, bottom:16, zIndex:60, maxWidth:560, margin:"0 auto",
          background:T.hotLt, color:T.hot, border:"1px solid "+T.hot+"55", borderRadius:8, padding:"11px 14px", fontSize:13, fontWeight:600 }}>
          {briefErr} <span style={{ color:T.mute, fontWeight:500 }}>(toucher pour fermer)</span>
        </div>
      )}
      {briefOpen && briefCache[briefOpen] && (
        <BriefModal brief={briefCache[briefOpen]} busy={!!briefBusy[briefOpen]}
          onClose={()=>setBriefOpen(null)}
          onRedo={()=>{ const b=briefCache[briefOpen]; doBrief({ entreprise:b.entreprise }, true); }} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
